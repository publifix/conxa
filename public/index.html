<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Conxa — Panadería</title>
<meta name="description" content="Conxa Panadería. Pan artesanal, horneado con tiempo. Sitio en construcción." />
<style>
  :root {
    --bg: #0c0a08;
    --fg: #f5efe6;
    --muted: #b8ab97;
    --accent: #e8a33d;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  .hero {
    position: relative;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 6vh 6vw;
    background-image:
      linear-gradient(180deg, rgba(12,10,8,0.55) 0%, rgba(12,10,8,0.75) 55%, rgba(12,10,8,0.96) 100%),
      url("assets/img/hero.jpg");
    background-size: cover;
    background-position: center;
  }
  .logo {
    width: min(78vw, 520px);
    height: auto;
    filter: drop-shadow(0 2px 18px rgba(0,0,0,0.55));
    margin-bottom: 1.75rem;
  }
  .tagline {
    font-size: clamp(1rem, 2.4vw, 1.35rem);
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 0 0 2.25rem;
    text-transform: uppercase;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 0.6em;
    font-size: 0.85rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--bg);
    background: var(--accent);
    padding: 0.6em 1.3em;
    border-radius: 999px;
    font-weight: 600;
  }
  .badge::before {
    content: "";
    width: 0.5em;
    height: 0.5em;
    border-radius: 50%;
    background: var(--bg);
    opacity: 0.6;
  }
  footer {
    position: absolute;
    bottom: 1.75rem;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 0.8rem;
    color: var(--muted);
    opacity: 0.7;
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>
  <main class="hero">
    <img class="logo" src="assets/img/logo.png" alt="Conxa" />
    <p class="tagline">Panadería artesanal</p>
    <span class="badge">Sitio en construcción</span>
  </main>
  <footer>&copy; <span id="year"></span> Conxa</footer>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
